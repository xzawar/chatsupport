name: Backend rules

# The security rules and the backend code are tested here, separately from the Android build:
#   npm test               offline suite (rules shape, RTDB evaluator, API, retention) - seconds
#   npm run test:emulator  the real Firestore + RTDB rules engines - authoritative
# No secrets are needed: the emulators run under a "demo-" project id.

on:
  push:
    branches: [ main, master ]
    paths:
      - firestore.rules
      - database.rules.json
      - firebase.json
      - functions/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - firestore.rules
      - database.rules.json
      - firebase.json
      - functions/**
      - .github/workflows/backend.yml
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore and RTDB emulators are Java programs.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.35.1

      - name: Install
        run: npm ci

      - name: Offline suite
        run: npm test

      - name: Rules through the emulator
        run: npm run test:emulator
